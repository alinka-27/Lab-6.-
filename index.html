<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сложный пример CSS Grid</title>
<style>
body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}
.grid-container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-areas:
        "wide     wide     wide     fullwidth fullwidth fullwidth"
        "bottom   bottom   bottom   bottom    bottom    bottom"
        "bigblock bigblock .        .         .         ."
        "bigblock bigblock .        .         .         ."
        ".        .        .        .         .         footer";
    gap: 10px;
    width: 90%;
    max-width: 1200px;
}
.item1, .item2, .item3 {
    display: none;
}
.item4 { grid-area: footer;    background-color: #4D96FF; }
.item5 { grid-area: bigblock;  background-color: #FFB6B9; }
.item6 { grid-area: wide;      background-color: #A1E8AF; }
.item7 { grid-area: fullwidth; background-color: #FFE156; }
.item8 { grid-area: bottom;    background-color: #FF9F1C; }
.grid-item {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5em;
    font-weight: bold;
    border-radius: 8px;
    padding: 20px;
    min-height: 100px;
}
.item5 { min-height: 220px; }
.item4 { min-height: 0; }
</style>
</head>
<body>
<div class="grid-container">
    <div class="grid-item item1">Заголовок</div>
    <div class="grid-item item2">Боковая панель</div>
    <div class="grid-item item3">Контент</div>
    <div class="grid-item item4">Футер</div>
    <div class="grid-item item5">Большой блок</div>
    <div class="grid-item item6">Широкий блок</div>
    <div class="grid-item item7">Во всю ширину</div>
    <div class="grid-item item8">Нижний блок</div>
</div>
</body>
</html>
